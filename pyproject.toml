[project]
name = "switchagent"
version = "1.0.25"
description = "Local Switch MTP file manager for DBI (scan/classify/extract/preview -> real or mock MTP transfer, queue+recovery, Web UI)"
requires-python = ">=3.11"

[project.scripts]
switch-agent = "switchagent.cli:main"
switch-agent-gui = "switchagent.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["switchagent", "switchagent.mtp", "switchagent.web"]

[tool.setuptools.package-data]
"switchagent.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.ico"]
